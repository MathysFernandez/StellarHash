name: Auto-rename Issue

on:
  issues:
    types: [opened, edited]

jobs:
  rename:
    runs-on: ubuntu-latest
    
    permissions:
      issues: write 

    steps:
      - name: rename the issue
        
        uses: actions/github-script@v7
        with:
          script: |
            const body = context.payload.issue.body;
            let title = context.payload.issue.title;
            
            const regex = /### What type of contribution is this\?\s+([a-z]+)/i;
            const match = body?.match(regex);
            
            if (match) {
              const type = match[1].toLowerCase();
              
              title = title.replace(/^\[?([a-z]+)\]?:\s*/i, "").trim();
              
              if (!title.startsWith(`${type}:`)) {
                const newTitle = `${type}: ${title}`;
                
                await github.rest.issues.update({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: context.issue.number,
                  title: newTitle
                });
                
                console.log(`Title renamed like this : "${newTitle}"`);
              }
            }
